name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      # 仓库只包含 lib/ 与配置。android 壳在临时目录现生成后拷入，
      # 避免 flutter create 覆盖本仓库的 lib/ 与 pubspec.yaml
      - name: Generate Android platform shell
        run: |
          cd /tmp
          flutter create --platforms=android --project-name zuot_quant --org com.zanyu shell_gen
          cp -r shell_gen/android "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE"
          flutter pub get

      # release 模式默认不带 INTERNET 权限，必须补上（行情接口走 HTTPS）
      - name: Add INTERNET permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>|' "$MANIFEST"
          fi
          echo "---- manifest ----"
          cat "$MANIFEST"

      # 把应用名从 shell 生成的 zuot_quant 改回中文显示名
      - name: Set app label
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="做T量化选股"|' "$MANIFEST"
          grep 'android:label' "$MANIFEST"

      # 快速门禁：不吞掉 analyze 的失败，类型错误在 1-2 分钟内就暴露，不用等 10 分钟 Gradle
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/zuot-quant-v2.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zuot-quant-apk
          path: dist/*.apk
          if-no-files-found: error
